CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Charging-state reporting is OFF pending investigation (2026-09-09). Enabling
# it required CONFIG_USB_DEVICE_STACK=y on the peripheral, and the split link
# then began flapping ~1/second (see the central's log: repeated
# "split_central_disconnected ... reason 19"). The left half's USB hardware is
# known dead, so bringing up a USB stack against a broken VBUS path is the
# leading suspect. Re-enable only once that is understood.
# CONFIG_ZMK_SPLIT_CHARGING_STATE=y
# CONFIG_USB_DEVICE_STACK=y
# USB logging lives in totem_right.conf, NOT here: ZMK_USB_LOGGING selects
# USB_DEVICE_STACK, and putting it in this shared file would force a USB stack
# onto the peripheral -- the very thing we are trying to rule out.
CONFIG_ZMK_USB_LOGGING=n
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
CONFIG_ZMK_POINTING=y
CONFIG_BT_SMP_ENFORCE_MITM=n
CONFIG_BT_SMP_SC_ONLY=n
CONFIG_BT_CTLR_PHY_2M=n

# --- BLE link stability (esp. for marginal hosts like the Linux MT7921) ---
# Works flawlessly on macOS/Windows; the MT7921 controller drops the link.
# ZMK defaults peripheral latency to 30, letting the keyboard go radio-silent for
# up to ~30 intervals (~450ms) when idle to save battery. Lenient hosts ride
# through that; the MT7921 loses sync and tears the link down -> the ~1x/min idle
# disconnect. Force latency 0 so the keyboard stays in constant contact. Keep a
# moderate interval (15-30ms) -- the aggressive 7.5ms default stressed the MT7921.
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Max nRF52840 TX power (+8 dBm). The XIAO's onboard chip antenna is weak; this
# strengthens both the host link and the inter-half link.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
