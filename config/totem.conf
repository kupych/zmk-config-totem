CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Publish each half's USB power state to the host (fork feature, see west.yml).
# The peripheral needs the USB device stack named explicitly: ZMK_USB would
# select it, but depends on ZMK_SPLIT_ROLE_CENTRAL and so is unavailable on the
# left half. This means the left half now runs a USB stack it previously
# didn't -- watch its idle drain over the next few days.
CONFIG_ZMK_SPLIT_CHARGING_STATE=y
CONFIG_USB_DEVICE_STACK=y
# TEMPORARY (2026-09-09): debugging why the central rejects BLE pairing with
# BT_SECURITY_ERR_PAIR_NOT_ALLOWED. Watch /dev/ttyACM* for ble.c's
# "Rejecting pairing request to taken profile %d". Revert once diagnosed --
# USB logging costs power and was deliberately off.
# ZMK_LOG_LEVEL defaults to 4 (debug), so the "open? yes/no" line comes too.
CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
CONFIG_ZMK_POINTING=y
CONFIG_BT_SMP_ENFORCE_MITM=n
CONFIG_BT_SMP_SC_ONLY=n
CONFIG_BT_CTLR_PHY_2M=n

# --- BLE link stability (esp. for marginal hosts like the Linux MT7921) ---
# Works flawlessly on macOS/Windows; the MT7921 controller drops the link.
# ZMK defaults peripheral latency to 30, letting the keyboard go radio-silent for
# up to ~30 intervals (~450ms) when idle to save battery. Lenient hosts ride
# through that; the MT7921 loses sync and tears the link down -> the ~1x/min idle
# disconnect. Force latency 0 so the keyboard stays in constant contact. Keep a
# moderate interval (15-30ms) -- the aggressive 7.5ms default stressed the MT7921.
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Max nRF52840 TX power (+8 dBm). The XIAO's onboard chip antenna is weak; this
# strengthens both the host link and the inter-half link.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
