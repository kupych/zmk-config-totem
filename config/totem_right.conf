# shared totem.conf, so this keeps USB logging off the peripheral.
#
# TEMPORARY (2026-09-09): watching the central's split link for the ~1/second
# "split_central_disconnected ... reason 19" flap. Remove once diagnosed --
# ZMK_USB_LOGGING costs power and pulls in the USB device stack.
CONFIG_ZMK_USB_LOGGING=y
