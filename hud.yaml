# keymap-hud config for this TOTEM. The HUD tool itself lives in the standalone
# repo: https://codeberg.org/kupych/zmk-keymap-hud  (see ~/zmk-keymap-hud).
# Point it here with:  KEYMAP_HUD_CONFIG=~/zmk-config-totem/hud.yaml
keymap: ~/zmk-config-totem/config/totem.keymap
# One name per transport: ZMK renames the device depending on how it is
# connected, and sends keys over whichever output is active, so list both or
# the HUD goes deaf whenever the cable goes in.
keyboard_name:
  - "TOTEM Keyboard"              # over BLE
  - "ZMK Project TOTEM Keyboard"  # over USB
draw_config: ./hud-draw.yaml      # TOTEM combo/macro relabels (|>, :=, HUD, clicks)

# The firmware publishes its layer state over BLE
# (CONFIG_ZMK_BLE_LAYER_STATE in our ZMK fork), so the HUD follows layers
# exactly and no sentinel keys are emitted at all. The keymap is plain
# &mo/&lt/&tog again; see the top of config/totem.keymap.
layer_source: ble
sentinels: {}
sticky_sentinels: {}

# combo_hud still taps F19 to show/hide the overlay — the last in-band signal.
toggle: F19
