# keymap-drawer draw config for the HUD overlay.
# Yellow wireframe on a transparent background, so it reads as a heads-up
# display floating over the desktop.
draw_config:
  # Transparent page background (the desktop shows through under mpv).
  svg_extra_style: |
    svg.keymap {
      background-color: transparent;
    }
    /* Key boxes: outline only, no fill. */
    rect.key {
      fill: none !important;
      stroke: #ffd400 !important;
      stroke-width: 1.4;
    }
    /* Combo boxes: solid yellow chip so they pop out of the wireframe. */
    rect.combo {
      fill: #ffd400 !important;
      stroke: #ffd400 !important;
      stroke-width: 1.4;
    }
    /* All legends/labels in yellow... */
    text {
      fill: #ffd400 !important;
      font-weight: 600;
    }
    /* ...except combo labels, which sit on the solid yellow chip: black. */
    text.combo {
      fill: #000000 !important;
    }
    /* Trans/blank keys: dim them so the real keys stand out. */
    rect.key.trans {
      stroke: #5a4d00 !important;
    }
    text.key.trans {
      fill: #5a4d00 !important;
    }

# Parse-time config (used by `keymap parse`): rewrite combo/macro bindings so
# the chips show their real output instead of the raw behavior name. These
# bindings only appear in combos, so nothing on the base layers is affected.
parse_config:
  raw_binding_map:
    "&pipe_arrow": "|>"
    "&thin_arrow": "->"
    "&fat_arrow": "=>"
    "&walrus": ":="
    "&hud_toggle": "HUD"
    "&mkp MB1": "L click"
    "&mkp MB2": "R click"
    "&mkp MB3": "M click"
